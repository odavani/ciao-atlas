<meta charset="utf-8">
<title>Ciao Group rate card</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/ciao-group-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;0,800;1,800&family=Noto+Sans:wght@400;500;600&display=swap">

<style>
/* Rate card and media kit, generated from the atlas plan. Same Ciao palette as the globe, on white paper:
   navy ink, brand rule at the top, green for Ciao's actions, teal for Ciao's own confirmed prices, gold for estimates.
   One page per screen when printed; the contact line repeats on every page. */
:root {
  color-scheme: light;
  --paper: #ffffff;
  --paper-2: #f3f7fa;
  --ink: #0d2238;
  --ink-dim: #4a6279;
  --ink-mute: #7f97ad;
  --line: #d6dfe8;
  --green: #73d43a;
  --green-ink: #0b220c;
  --green-text: #3f8f1a;
  --teal: #2a9d87;
  --teal-soft: #e4f5f1;
  --gold: #a7761a;
  --gold-soft: #fbf3e3;
  --brand-rule: linear-gradient(90deg, #73d43a 0%, #43c5ad 50%, #5aa7e1 100%);
  --cjk: "Noto Sans SC";
  --font-display: "Archivo", var(--cjk), "Helvetica Neue", Arial, sans-serif;
  --font-body: "Noto Sans", var(--cjk), "Helvetica Neue", Arial, sans-serif;
  --r: 8px;
}
:root[lang="zh-TW"] { --cjk: "Noto Sans TC"; }
:root[lang="ko"] { --cjk: "Noto Sans KR"; }
:root[lang="ja"] { --cjk: "Noto Sans JP"; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { background: #e9eef3; }
body { margin: 0; color: var(--ink); font: 13px/1.5 var(--font-body); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
:root:not([lang="en"]) i, :root:not([lang="en"]) em { font-style: normal; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- screen-only toolbar ---------- */
.bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px;
  background: rgba(13, 34, 56, .96); color: #eef4f8; border-bottom: 1px solid #22456b; }
.bar .sp { flex: 1; }
.bar select { appearance: none; -webkit-appearance: none; background: #14304f; border: 1px solid #22456b; border-radius: 999px; padding: 5px 28px 5px 12px; font-size: 12.5px; color: #eef4f8; }
.bar .sel { position: relative; }
.bar .sel::after { content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border: solid #a3b8cb; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
.bar .hint { font-size: 12px; color: #a3b8cb; }
.bar .cta { border: 0; border-radius: var(--r); padding: 8px 16px; background: var(--green); color: var(--green-ink); font-weight: 600; font-size: 13.5px; }
.bar .cta:active { transform: translateY(1px); }
.bar a { color: #a3b8cb; font-size: 12.5px; }

/* ---------- document ---------- */
.doc { max-width: 820px; margin: 24px auto 48px; background: var(--paper); box-shadow: 0 8px 30px rgba(13, 34, 56, .12); }
.page { padding: 34px 40px; }
.cover { position: relative; border-bottom: 1px solid var(--line); }
.cover::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--brand-rule); }
.cover .brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
.cover .brand img { height: 30px; width: auto; display: block; }
.cover .issued { font-size: 12px; color: var(--ink-dim); text-align: right; }
.cover h1 { margin: 0 0 6px; font: italic 800 34px/1.08 var(--font-display); letter-spacing: -.005em; text-wrap: balance; }
:root:not([lang="en"]) .cover h1 { font-style: normal; }
.cover .lede { margin: 0; font-size: 14.5px; color: var(--ink-dim); max-width: 60ch; }
.contact { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 10px 18px; margin: 24px 0 0; padding-top: 18px; border-top: 1px solid var(--line); }
.contact div { min-width: 0; }
.contact dt { font: 700 10.5px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 4px; }
.contact dd { margin: 0; font-size: 12.5px; font-weight: 500; overflow-wrap: break-word; }
.summary { border-bottom: 1px solid var(--line); }
.cover + .summary { border-top: 0; }
.toc { padding: 18px 40px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 2px 28px; font-size: 12.5px; }
.toc a { color: var(--ink); text-decoration: none; display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dotted var(--line); }
.toc a span:last-child { color: var(--ink-dim); white-space: nowrap; }
.toc h2 { grid-column: 1 / -1; margin: 10px 0 4px; font: 700 11px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); }
.toc h2:first-child { margin-top: 0; }

/* ---------- one screen ---------- */
.board { border-bottom: 1px solid var(--line); break-inside: avoid; page-break-inside: avoid; }
.board .top { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; align-items: start; }
.board .photo { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r); overflow: hidden; background: var(--paper-2); }
.board .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.board .photo.noimg { display: grid; place-items: center; color: var(--ink-mute); font-size: 12px; }
.credit { margin: 5px 0 0; font-size: 10px; color: var(--ink-mute); line-height: 1.35; }
.credit a { color: inherit; }
.where { font-size: 12.5px; color: var(--ink-dim); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kind { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; color: var(--green-text); border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; line-height: 16px; }
.board h2 { margin: 2px 0 0; font: 800 22px/1.15 var(--font-display); letter-spacing: -.005em; }
.board h2 small { display: block; font: 500 12.5px/1.3 var(--font-body); color: var(--ink-dim); margin-top: 2px; }
.why { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-dim); max-width: 62ch; }
.badge { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 600;
  background: var(--gold-soft); color: var(--gold); margin-top: 10px; }
.badge.ok { background: var(--teal-soft); color: var(--teal); }
.badge svg { width: 13px; height: 13px; fill: currentColor; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 16px; margin: 14px 0 0; }
.facts div { min-width: 0; }
.facts dt { font: 700 10.5px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 3px; }
.facts dd { margin: 0; font-size: 13px; }
.sel-date { margin-top: 12px; padding: 8px 12px; border-radius: var(--r); background: var(--paper-2); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; }
.sel-date b { font-weight: 600; }

.prices { margin-top: 18px; }
.prices h3 { margin: 14px 0 6px; font: 700 13px/1.3 var(--font-display); }
.prices h3:first-child { margin-top: 0; }
.prices table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.prices th { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-mute); text-align: right; padding: 0 8px 6px; white-space: nowrap; }
.prices th:first-child { text-align: left; padding-left: 0; }
.prices td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; text-align: right; white-space: nowrap; font-weight: 600; }
.prices td:first-child { text-align: left; padding-left: 0; white-space: normal; font-weight: 400; }
.prices td b { display: block; font-weight: 600; }
.prices td small { display: block; color: var(--ink-dim); font-size: 11.5px; line-height: 1.35; font-weight: 400; white-space: normal; }
.prices tr.pick td { background: var(--teal-soft); }
.prices tr.pick td:first-child { border-left: 3px solid var(--teal); padding-left: 8px; }
.prices .na { color: var(--ink-mute); font-weight: 400; }
.prices .fixed { font-weight: 500; color: var(--ink-dim); }
.prices .range { display: block; font-size: 11px; color: var(--ink-dim); font-weight: 400; }
.prices .about { font-weight: 400; color: var(--ink-dim); font-size: 11.5px; margin-right: 3px; }
.note { margin: 10px 0 0; font-size: 11.5px; color: var(--ink-dim); }
.onreq { margin-top: 18px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: var(--r); font-size: 12.5px; color: var(--ink-dim); }
.cond { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
.cond.one { grid-template-columns: 1fr; }
.cond dt { font: 700 10.5px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 3px; }
.cond dd { margin: 0; font-size: 12px; color: var(--ink-dim); }

/* ---------- plan summary and terms ---------- */
.summary table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 12px; }
.summary th { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-mute); text-align: left; padding: 0 8px 6px 0; }
.summary th.r, .summary td.r { text-align: right; white-space: nowrap; }
.summary td { padding: 7px 8px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
.summary td small { display: block; color: var(--ink-dim); font-size: 11.5px; }
.summary .total td { border-top: 2px solid var(--ink); font-weight: 700; font-size: 14px; padding-top: 10px; }
.page h2.sec { margin: 0 0 4px; font: 800 20px/1.2 var(--font-display); letter-spacing: -.005em; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 14px; counter-reset: step; }
.steps div { font-size: 12px; color: var(--ink-dim); }
.steps div::before { counter-increment: step; content: counter(step); display: block; width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: var(--green-ink);
  font: 700 12px/26px var(--font-display); text-align: center; margin-bottom: 8px; }
.steps b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
.terms p { margin: 10px 0 0; font-size: 12px; color: var(--ink-dim); max-width: 70ch; }
.foot-line { display: none; }
.empty { padding: 60px 40px; text-align: center; color: var(--ink-dim); }
.empty a { color: var(--green-text); }

/* ---------- print ---------- */
@page { size: A4; margin: 12mm 12mm 16mm; }
@media print {
  html { background: #fff; }
  .bar { display: none; }
  .doc { max-width: none; margin: 0; box-shadow: none; }
  .page { padding: 6mm 0; }
  .cover, .toc { padding-left: 0; padding-right: 0; }
  .board { page-break-after: always; break-after: page; border-bottom: 0; }
  .board:last-of-type { page-break-after: auto; break-after: auto; }
  .board .top { grid-template-columns: 62mm minmax(0, 1fr); }
  .foot-line { display: flex; position: fixed; left: 0; right: 0; bottom: 0; justify-content: space-between; gap: 12px; font-size: 9.5px; color: var(--ink-mute);
    border-top: 1px solid var(--line); padding-top: 4px; background: #fff; }
  .foot-line span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  a { color: inherit; text-decoration: none; }
}
@media (max-width: 720px) {
  .page { padding: 24px 18px; }
  .board .top { grid-template-columns: 1fr; }
  .facts { grid-template-columns: 1fr 1fr; }
  .cond { grid-template-columns: 1fr; }
  .steps { grid-template-columns: 1fr 1fr; }
  .toc { grid-template-columns: 1fr; padding: 16px 18px; }
}
</style>
</head>

  const Q = new URLSearchParams(location.search);

  if (!CURS.includes(S.cur)) S.cur = 'USD';

  const t = (k, vars) => { let s = (LOCAL[S.lang] && LOCAL[S.lang][k]) ?? LOCAL.en[k] ?? (S.str[S.lang] && S.str[S.lang][k]) ?? (S.str.en && S.str.en[k]) ?? k;
    if (vars) for (const v in vars) s = s.split('{' + v + '}').join(vars[v]); return s; };
  const common = (k, fb) => (S.i18n[S.lang] && S.i18n[S.lang].common && S.i18n[S.lang].common[k]) || fb;
  const tb = (b, f) => (b.i18n && b.i18n[S.lang] && b.i18n[S.lang][f]) || b[f];
  const city = (b) => (S.i18n[S.lang] && S.i18n[S.lang].cities && S.i18n[S.lang].cities[b.city]) || b.city;
  const country = (b) => (S.i18n[S.lang] && S.i18n[S.lang].countries && S.i18n[S.lang].countries[b.country]) || b.country;
  const locale = () => ({ en: 'en-US', 'zh-CN': 'zh-CN', 'zh-TW': 'zh-TW', ko: 'ko-KR', ja: 'ja-JP' }[S.lang]);
  function money(usd) {
    const cur = S.cur, v = usd * (S.fx[cur] || 1);
    try { return new Intl.NumberFormat(locale(), { style: 'currency', currency: cur, maximumFractionDigits: 0, minimumFractionDigits: 0 }).format(v); }
    catch { return cur + ' ' + Math.round(v).toLocaleString(); }
  }

  const fmtLoop = (s) => (s ? (s >= 60 ? t('mins', { n: +(s / 60).toFixed(s % 60 ? 1 : 0) }) : t('secShort', { n: s })) : '');

  // ----- rate card helpers (same shapes as the atlas) -----
  function rcOptions(b) {

      if (r.addon || r.included) return;
      const named = g.columns.length > 1 || g.columns[0] !== 'Price';
      r.prices.forEach((p, ci) => { if (p != null) out.push({ key: `${gi}:${ri}:${ci}`, gi, ri, ci, price: p, named }); });
    }));
    return out;
  }
  function rcText(b, gi, ri) {

    const g = b.ratecard.groups[gi], tr = tg && tg.rows && tg.rows[ri];
    return { title: (tg && tg.title) || g.title, label: ri == null ? '' : ((tr && tr.label) || g.rows[ri].label), sub: ri == null ? '' : ((tr && tr.sub) || g.rows[ri].sub || '') };
  }

  function lineText(b, l, pkg) {
    let label = common('line.' + l.key, l.label), desc = l.desc;

  function itemPrice(b, it) {

  }
  function itemLabel(b, it) {

    return b.packages[it.sel] ? t('p.' + it.sel) : '';
  }

  // ----- selection: ?items=id|sel|date;... or ?kit=all|ces|<region>, else the plan saved by the atlas -----
  function resolveItems() {
    const kit = (Q.get('kit') || '').trim();

    if (kit) {
      S.mode = 'kit'; S.kit = kit;
      let list = S.boards.filter((b) => b.enquiry !== 'concept');
      if (kit === 'ces') list = list.filter((b) => b.city === 'Las Vegas');
      else if (kit !== 'all') list = list.filter((b) => b.region === kit);
      const order = (b) => [REGIONS.indexOf(b.region), b.country, b.city, isEnq(b) ? 1 : 0, b.name];
      list.sort((a, b) => { const x = order(a), y = order(b); for (let i = 0; i < x.length; i++) { if (x[i] < y[i]) return -1; if (x[i] > y[i]) return 1; } return 0; });
      return list.map((b) => ({ id: b.id, sel: '', date: '' }));
    }
    let items;
    if (raw != null) items = raw.split(';').filter(Boolean).map((s) => { const [id, sel = '', date = ''] = s.split('|'); return { id, sel, date }; });
    else items = (store.get('ciao-plan', []) || []).map((p) => ({ id: p.id, sel: p.opt || p.pkg || '', date: p.date || '' }));
    S.mode = 'plan';
    return items.filter((it) => S.byId[it.id] && S.byId[it.id].enquiry !== 'concept');
  }

  // ----- views -----
  const fact = (label, v) => (v ? `<div><dt>${esc(label)}</dt><dd>${esc(v)}</dd></div>` : '');
  function badge(b, q) {
    if (b.ratecard) return `<span class="badge ok">${ICON_CHECK}${esc(t('ratecard', { d: fmtDate(b.ratecard.issued) }))}</span>`;
    if (isEnq(b)) return `<span class="badge">${esc(t('enqBadge'))}</span>`;
    const src = q && q.source;
    if (src === 'confirmed') return `<span class="badge ok">${ICON_CHECK}${esc(t('confirmed'))}</span>`;
    if (src === 'quoted') return `<span class="badge ok">${esc(t('quoted'))}</span>`;
    return `<span class="badge">${esc(t('c.' + (b.confidence || 'none')))}</span>`;
  }
  function rateCardTable(b, it) {
    const rc = b.ratecard;
    return rc.groups.map((g, gi) => {

      const named = g.columns.length > 1 || g.columns[0] !== 'Price';
      const head = `<thead><tr><th>${esc(t('what'))}</th>${g.columns.map((c) => `<th>${esc(named ? colName(c) : t('price'))}</th>`).join('')}</tr></thead>`;
      const rows = g.rows.map((r, ri) => {
        const tx = rcText(b, gi, ri);
        const pick = r.prices.some((p, ci) => `${gi}:${ri}:${ci}` === it.sel);
        return `<tr${pick ? ' class="pick"' : ''}><td><b>${esc(tx.label)}</b>${tx.sub ? `<small>${esc(tx.sub)}</small>` : ''}</td>${r.prices.map((p) => {
          if (r.included) return `<td><span class="fixed">${esc(t('included'))}</span></td>`;
          if (p == null) return `<td><span class="na">${esc(t('notOffered'))}</span></td>`;
          if (r.addon) return `<td><span class="fixed">${money(p)} ${esc(common('unit.' + r.unit, r.unit || ''))}</span></td>`;
          return `<td class="num">${money(p)}</td>`;
        }).join('')}</tr>`;
      }).join('');
      return `<h3>${esc(tg.title)}${g.net ? ' ' + esc(t('net')) : ''}</h3><table>${head}<tbody>${rows}</tbody></table>`;
    }).join('');
  }
  function estimateTable(b, it) {
    const pk = PKGS.filter((k) => b.packages[k]);
    const rows = pk.map((k) => {
      const q = b.packages[k], screen = q.lines.find((l) => l.key === 'screen') || q.lines[0];

      return `<tr${it.sel === k ? ' class="pick"' : ''}><td><b>${esc(t('p.' + k))}</b><small>${esc(desc)}</small></td><td class="num">${exact ? '' : `<span class="about">${esc(t('about'))}</span>`}${money(q.total.mid)}${range}</td></tr>`;
    }).join('');
    const first = b.packages[pk[0]];
    const inc = first.lines.filter((l) => l.key !== 'screen' && l.key !== 'tax').map((l) => lineText(b, l, pk[0]).label.toLowerCase());
    const tax = first.lines.find((l) => l.key === 'tax');  // package totals already carry local tax where it applies: say so
    const taxLbl = tax ? `${common('tax.' + tax.tax_name, tax.tax_name || '')} ${Math.round((tax.rate || 0) * 1000) / 10}%`.trim() : '';
    const anyEst = pk.some((k) => !['confirmed', 'quoted'].includes(b.packages[k].source));
    return `<table><thead><tr><th>${esc(t('what'))}</th><th>${esc(t('price'))}</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="note">${esc([inc.length ? t('includes', { x: inc.join(', ') }) : '', taxLbl ? t('taxIncl', { x: taxLbl }) : '', anyEst ? t('estNote') : '', t('datesNote')].filter(Boolean).join(' '))}</p>`;
  }
  function boardView(b, it, n) {

  function title() {

  function render() {

      const from = b.ratecard ? Math.min(...rcOptions(b).map((o) => o.price)) : !isEnq(b) ? Math.min(...Object.values(b.packages).filter(Boolean).map((x) => x.total.lo)) : null;
      return `<a href="#b-${esc(b.id)}"><span>${esc(tb(b, 'name'))}, ${esc(city(b))}</span><span class="num">${p != null ? money(p) : from != null ? t('fromTpl', { p: money(from) }) : t('amtOnRequest')}</span></a>`; }).join('')).join('')}</nav>` : '';
    const priced = items.filter((it) => itemPrice(S.byId[it.id], it) != null), anyEnq = items.some((it) => isEnq(S.byId[it.id]));
    const summary = S.mode === 'plan' && items.length > 1 ? `<section class="page summary"><h2 class="sec">${esc(t('yourPlan'))}</h2>
      <table><thead><tr><th>${esc(t('planLbl'))}</th><th>${esc(t('option'))}</th><th>${esc(t('date'))}</th><th class="r">${esc(t('price'))}</th></tr></thead><tbody>
      ${items.map((it) => { const b = S.byId[it.id], p = itemPrice(b, it);
        return `<tr><td>${esc(tb(b, 'name'))}<small>${esc(city(b))}, ${esc(country(b))}</small></td><td>${esc(itemLabel(b, it))}</td><td>${esc(it.date ? fmtDate(it.date) : '')}</td><td class="r num">${p != null ? (b.ratecard || ['confirmed', 'quoted'].includes((b.packages[it.sel] || {}).source) ? '' : t('about') + ' ') + money(p) : t('amtOnRequest')}</td></tr>`; }).join('')}
      ${priced.length ? `<tr class="total"><td colspan="3">${esc(t(anyEnq ? 'estTotalPartial' : 'estTotal'))}</td><td class="r num">${money(priced.reduce((s, it) => s + itemPrice(S.byId[it.id], it), 0))}</td></tr>` : ''}
      </tbody></table><p class="note">${esc([fxNote(), t('datesNote')].filter(Boolean).join(' '))}</p></section>` : '';
    $('#doc').innerHTML = `<header class="cover page">
        <div class="brand"><img src="assets/ciao-group-logo.png" alt="${esc(CONTACT.company)}"><div class="issued">${esc(t('issued', { d: fmtDate(today) }))}<br>${esc(t('pricesIn', { c: S.cur }))}</div></div>
        <h1>${esc(title())}</h1>
        <p class="lede">${esc(lede(items.length, cities))}</p>
        ${contactBlock()}
      </header>
      ${summary}
      ${toc}
      ${boards.map((b, i) => boardView(b, items[i], i)).join('')}
      <section class="page terms"><h2 class="sec">${esc(t('howTitle'))}</h2>
        <div class="steps">${[1, 2, 3, 4].map((n) => `<div><b>${esc(t('s' + n))}</b>${esc(t('s' + n + 't'))}</div>`).join('')}</div>
        <p>${esc(t('termsNote'))}</p>
        ${contactBlock()}
      </section>`;
  }

  function syncUrl() {
    const u = new URL(location.href); u.searchParams.set('lang', S.lang); u.searchParams.set('cur', S.cur);
    try { history.replaceState(null, '', u); } catch {}
  }
  $('#langSel').addEventListener('change', (e) => { S.lang = e.target.value; store.set('ciao-lang', S.lang); if (!Q.get('cur')) { S.cur = LANG_CUR[S.lang] || 'USD'; } syncUrl(); render(); });
  $('#curSel').addEventListener('change', (e) => { S.cur = e.target.value; store.set('ciao-cur', S.cur); syncUrl(); render(); });
  $('#printBtn').addEventListener('click', () => window.print());

  Promise.all([fetch('data/boards.json').then((r) => r.json()), fetch('data/ui-strings.json').then((r) => r.json())]).then(([data, str]) => {
    S.boards = data.boards; S.byId = Object.fromEntries(S.boards.map((b) => [b.id, b]));
    S.fx = Object.assign({ USD: 1 }, (data.meta && data.meta.fx_per_usd) || {}); S.i18n = (data.meta && data.meta.i18n) || {}; S.str = str;
    S.items = resolveItems();
    render();
  }).catch((e) => { $('#doc').innerHTML = `<p class="empty">${esc(String(e))}</p>`; });
})();
</script>
</body>
</html>
