<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Ciao Billboard Atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;0,800;1,800&family=Noto+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" id="cjkFont" href="data:text/css,">
<style>
/* Layout: full-bleed night globe; browse rail floats left, billboard detail docks right (bottom sheets on phones).
   Brand: Ciao Group rate-card palette. Navy ground, green-to-blue logo gradient used only on the logo and the
   signature rule under the header, brand green for actions and pins, teal for Ciao's own confirmed prices.
   Single dark theme on purpose: the globe is the night side, every pin a lit screen. */
:root {
  color-scheme: dark;
  --night: #071423;
  --panel: #0d2238;
  --panel-2: #14304f;
  --line: #22456b;
  --ink: #eef4f8;
  --ink-dim: #a3b8cb;
  --ink-mute: #7f97ad;
  --green: #73d43a;          /* Ciao logo green: actions, pins */
  --green-ink: #0b220c;
  --green-soft: rgba(115, 212, 58, .14);
  --teal: #43c5ad;           /* Ciao rate-card teal: Ciao's own prices */
  --blue: #5aa7e1;           /* Ciao logo blue */
  --gold: #daa442;           /* Ciao rate-card gold: estimates */
  --brand-rule: linear-gradient(90deg, #73d43a 0%, #43c5ad 50%, #5aa7e1 100%);
  --cjk: "Noto Sans SC";
  --font-display: "Archivo", var(--cjk), "Helvetica Neue", Arial, sans-serif;
  --font-body: "Noto Sans", var(--cjk), "Helvetica Neue", Arial, sans-serif;
  --r: 8px;                  /* panels, inputs, thumbs; pills and chips are full-round */
  --rail-w: 348px;
  --panel-w: 448px;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
:root[lang="zh-TW"] { --cjk: "Noto Sans TC"; }
:root[lang="ko"] { --cjk: "Noto Sans KR"; }
:root[lang="ja"] { --cjk: "Noto Sans JP"; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font: 15px/1.5 var(--font-body); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.ico { width: 18px; height: 18px; fill: currentColor; flex: none; }
.num { font-variant-numeric: tabular-nums; }

#app { position: relative; height: 100%; overflow: hidden; }
#globe { position: absolute; inset: 0; z-index: 0; isolation: isolate; transition: transform .6s var(--ease); }
#globe canvas { display: block; }
body.panel-open #globe { transform: translateX(calc(var(--panel-w) / -2 + var(--rail-w) / 2)); }
body:not(.panel-open) #globe { transform: translateX(calc(var(--rail-w) / 2)); }

/* ---------- markers ---------- */
.mk { pointer-events: auto; position: relative; width: 0; height: 0; transition: opacity .25s; }
.mk button { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: grid; place-items: center;
  border: 0; padding: 0; background: none; width: 30px; height: 30px; border-radius: 50%; }
.mk .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green);
  box-shadow: 0 0 0 3px rgba(115, 212, 58, .22), 0 0 14px 2px rgba(115, 212, 58, .5); transition: transform .2s var(--ease); }
.mk.multi .dot { width: 20px; height: 20px; display: grid; place-items: center; font: 700 11px/1 var(--font-display); color: var(--green-ink); }
.mk button:hover .dot, .mk.active .dot { transform: scale(1.35); }
.mk.active .dot { background: #f2fff0; }
.mk.dim { opacity: .18; pointer-events: none; }
.mk .lbl { position: absolute; left: 11px; top: -9px; white-space: nowrap; pointer-events: none; font: 700 12.5px/1 var(--font-display);
  letter-spacing: .02em; color: var(--ink); text-shadow: 0 1px 3px rgba(0, 0, 0, .95), 0 0 8px rgba(0, 0, 0, .85); opacity: 0; transition: opacity .25s; }
.mk.multi .lbl { left: 16px; }
.mk.major .lbl, body.zoomed .mk .lbl, .mk.active .lbl { opacity: 1; }
.mk.dim .lbl { opacity: 0; }
.scene-tooltip, .float-tooltip-kap { font: 500 12.5px var(--font-body) !important; color: var(--ink) !important;
  background: rgba(13, 34, 56, .92) !important; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px !important; }

/* ---------- rail ---------- */
.rail { position: absolute; top: 16px; left: 16px; bottom: 16px; width: var(--rail-w); z-index: 2; display: flex; flex-direction: column; min-height: 0;
  background: rgba(13, 34, 56, .88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.rail::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--brand-rule); }
.mast { padding: 20px 20px 14px; display: grid; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { height: 24px; width: auto; display: block; }
.brand span { font: 700 13px/1.1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }
.prefs { display: flex; gap: 8px; flex-wrap: wrap; }
.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 26px 4px 11px; font-size: 12.5px; font-weight: 500; color: var(--ink); cursor: pointer; }
.sel::after { content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border: solid var(--ink-dim);
  border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
.mast h1 { margin: 2px 0 0; font: italic 800 28px/1.08 var(--font-display); text-wrap: balance; letter-spacing: -.005em; }
:root:not([lang="en"]) .mast h1 { font-style: normal; }  /* no synthetic italics on CJK */
.mast p { margin: 0; color: var(--ink-dim); font-size: 13.5px; }
.search { position: relative; margin: 0 20px; display: block; }
.search .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-dim); width: 16px; height: 16px; }
.search input { width: 100%; box-sizing: border-box; padding: 9px 12px 9px 34px; border-radius: var(--r); background: var(--panel-2); border: 1px solid var(--line); outline: none; }
.search input::placeholder { color: var(--ink-mute); }
.search input:focus { border-color: var(--green); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 20px; }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 12px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--ink-dim);
  display: inline-flex; gap: 6px; align-items: baseline; }
.chip em { font-style: normal; font-size: 11px; opacity: .75; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); font-weight: 600; }
.list { border-top: 1px solid var(--line); overflow-y: auto; flex: 1; min-height: 0; padding: 6px 8px 12px; overscroll-behavior: contain; }
.list h2 { font: 700 12px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); margin: 16px 12px 6px; }
.row { width: 100%; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left;
  border: 0; background: none; padding: 7px 12px; border-radius: var(--r); }
.row:hover, .row.active { background: var(--panel-2); }
.row img, .row .noimg { width: 52px; height: 36px; object-fit: cover; border-radius: 4px; background: var(--panel-2); display: block; }
.row .t b { display: block; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t span { display: block; font-size: 12.5px; color: var(--ink-dim); }
.row .p { font: 600 12.5px var(--font-display); color: var(--ink-dim); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .p small { display: block; font: 400 10.5px var(--font-body); color: var(--ink-mute); }
.kind { display: inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; color: var(--green);
  border: 1px solid rgba(115, 212, 58, .45); border-radius: 999px; padding: 0 6px; vertical-align: 1px; }
.empty { padding: 28px 14px; color: var(--ink-dim); font-size: 14px; }

/* ---------- hover peek ---------- */
.peek { position: fixed; z-index: 4; width: 260px; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden; box-shadow: 0 18px 50px rgba(2, 8, 16, .6); animation: peek .22s var(--ease); }
@keyframes peek { from { opacity: 0; transform: translateY(6px); } }
.peek img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--panel-2); }
.peek .b { padding: 10px 12px 12px; display: grid; gap: 2px; }
.peek b { font: 800 18px/1.15 var(--font-display); }
.peek span { font-size: 12.5px; color: var(--ink-dim); }
.peek .from { margin-top: 6px; font: 700 13px var(--font-display); color: var(--green); }

/* ---------- detail panel ---------- */
.panel { position: absolute; top: 16px; right: 16px; bottom: 16px; width: var(--panel-w); z-index: 3; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; overflow: hidden; animation: slide .45s var(--ease); }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.panel .scroll { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; overscroll-behavior: contain; }
.hero { position: relative; }
.hero img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--panel-2); }
.hero .noimg { aspect-ratio: 16 / 9; background: var(--panel-2); }
.x { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .2);
  background: rgba(7, 20, 35, .74); display: grid; place-items: center; }
.credit { font-size: 11px; color: var(--ink-mute); padding: 6px 20px 0; margin: 0; }
.credit a { color: inherit; }
.siblings { display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 2px; }
.sib { flex: none; width: 112px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); padding: 0; overflow: hidden; text-align: left; }
.sib img, .sib .noimg { display: block; width: 100%; height: 56px; object-fit: cover; }
.sib span { display: block; padding: 5px 7px 6px; font-size: 11.5px; line-height: 1.25; height: 2.5em; overflow: hidden; }
.sib[aria-current="true"] { border-color: var(--green); }
.body { padding: 16px 20px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.where { font-size: 13px; color: var(--ink-dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.where .ico { width: 15px; height: 15px; color: var(--green); }
.body h2 { margin: 2px 0 0; font: 800 32px/1.05 var(--font-display); text-wrap: balance; }
.why { margin: 0; color: var(--ink-dim); max-width: 60ch; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font: 700 11px/1.2 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); }
.facts dd { margin: 3px 0 0; font-size: 14px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: var(--r); padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 5px; padding: 8px 6px; font-weight: 500; font-size: 14px; color: var(--ink-dim); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.pkgdesc { margin: -8px 0 0; font-size: 13px; color: var(--ink-dim); }
.line { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.line b { font-weight: 500; }
.line small { grid-column: 1; color: var(--ink-mute); font-size: 12.5px; }
.line .amt { font: 600 14px var(--font-display); text-align: right; grid-row: 1; grid-column: 2; font-variant-numeric: tabular-nums; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; gap: 12px; }
.total span { font: 700 13px var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.total strong { font: 800 38px/1 var(--font-display); color: var(--green); font-variant-numeric: tabular-nums; }
.range { font-size: 12.5px; color: var(--ink-dim); margin-top: 6px; text-align: right; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 3px 10px; font-size: 12px;
  border: 1px solid rgba(218, 164, 66, .5); color: var(--gold); background: rgba(218, 164, 66, .1); }
.badge.ok { border-color: rgba(67, 197, 173, .55); color: var(--teal); background: rgba(67, 197, 173, .1); }
.badge .ico { width: 14px; height: 14px; }
.unavail { padding: 16px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--ink-dim); font-size: 14px; }
.note { font-size: 12.5px; color: var(--ink-dim); margin: 0; }

/* rate card (Ciao's issued prices) */
.rc { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.rc > div { min-width: 0; }
.rc h3 { margin: 0 0 8px; font: 700 12.5px/1.35 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--teal); text-wrap: balance; }
.rcwrap { overflow-x: auto; }
.rc table { width: 100%; border-collapse: collapse; font-size: 13px; }
.rc th { font-size: 11.5px; font-weight: 500; color: var(--ink-mute); text-align: right; padding: 0 4px 6px; white-space: nowrap; }
.rc td { border-top: 1px solid var(--line); padding: 4px; vertical-align: middle; }
.rc td:first-child { padding-left: 0; min-width: 104px; }
.rc td b { display: block; font-weight: 500; font-size: 13.5px; }
.rc td small { display: block; color: var(--ink-mute); font-size: 11.5px; line-height: 1.3; }
.opt { width: 100%; border: 1px solid transparent; background: none; border-radius: 5px; padding: 6px; text-align: right;
  font: 600 12.5px var(--font-display); white-space: nowrap; color: var(--ink); font-variant-numeric: tabular-nums; }
.opt:hover { border-color: var(--line); background: var(--panel-2); }
.opt[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.fixed { display: block; text-align: right; font: 600 12.5px var(--font-display); padding: 6px; white-space: nowrap; color: var(--ink-dim); }
.na { display: block; text-align: right; color: #4f6a84; padding: 6px; }
.pick { display: grid; gap: 4px; }
.pick p { margin: 0; font-size: 13px; color: var(--ink-dim); }

.foot { padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--panel); display: grid; gap: 8px; }
.cta { width: 100%; border: 0; border-radius: var(--r); padding: 13px 16px; background: var(--green); color: var(--green-ink); font-weight: 600; font-size: 15px;
  display: flex; justify-content: center; gap: 8px; align-items: center; transition: transform .15s var(--ease), background .2s; }
.cta:active { transform: translateY(1px) scale(.99); }
.cta:disabled { opacity: .5; cursor: not-allowed; }
.cta.ghost { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

/* plan + inquiry */
.planbtn { position: absolute; top: 16px; right: 16px; z-index: 3; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px;
  background: rgba(13, 34, 56, .88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); font-weight: 500; font-size: 14px; }
.planbtn em { font-style: normal; font: 700 12px var(--font-display); background: var(--green); color: var(--green-ink); border-radius: 999px; padding: 1px 7px; }
body.panel-open .planbtn { right: calc(var(--panel-w) + 28px); }
.head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.pitem { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; gap: 6px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pitem img, .pitem .noimg { width: 52px; height: 36px; object-fit: cover; border-radius: 4px; background: var(--panel-2); display: block; }
.pitem .t b { display: block; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pitem .t span { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.pitem select, .pitem input { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; font-size: 12.5px; padding: 3px 6px; max-width: 100%; min-width: 0; }
.pitem .amt { font: 600 13px var(--font-display); font-variant-numeric: tabular-nums; }
.iconbtn { border: 0; background: none; color: var(--ink-dim); padding: 6px; border-radius: 5px; display: grid; place-items: center; }
.iconbtn:hover { color: var(--ink); background: var(--panel-2); }
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; color: var(--ink-dim); }
.field input, .field select, .field textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; outline: none; font-size: 15px; }
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green); }
.err { color: #ff9b8a; font-size: 13px; margin: 0; }
.summary { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; font-size: 13px; color: var(--ink-dim); white-space: pre-wrap; max-height: 220px; overflow: auto; }
.addr { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--r); padding: 8px 8px 8px 12px; user-select: all; font-weight: 600; }
.addr button { user-select: none; }
.done { display: grid; gap: 10px; justify-items: start; }
.done .tick { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--green-soft); color: var(--green); }
.done .tick .ico { width: 24px; height: 24px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 9; background: var(--ink); color: var(--night); padding: 9px 16px;
  border-radius: 999px; font-size: 14px; font-weight: 500; animation: peek .2s var(--ease); }

/* astronaut (Sent Into Space) floating in orbit */
.mk.astro button { width: 72px; height: 90px; border-radius: 0; }
.mk.astro svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 12px rgba(90, 167, 225, .6)); transition: filter .2s; }
.mk.astro button:hover svg, .mk.astro.active svg { filter: drop-shadow(0 0 18px rgba(115, 212, 58, .85)); }
.mk.astro .lbl { opacity: 1; left: 0; top: 50px; transform: translateX(-50%); font-size: 12px; background: rgba(7, 20, 35, .78); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
@media (prefers-reduced-motion: no-preference) { .mk.astro svg { animation: drift 6s ease-in-out infinite; } }
@keyframes drift { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
.gal { display: flex; gap: 6px; overflow-x: auto; padding: 10px 20px 0; }
.gal button { flex: none; width: 68px; height: 46px; padding: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden; background: var(--panel-2); opacity: .65; transition: opacity .15s; }
.gal button[aria-current="true"] { border-color: var(--green); opacity: 1; }
.gal img { width: 100%; height: 100%; object-fit: cover; display: block; }
.facts.one { grid-template-columns: minmax(0, 1fr); gap: 10px; }
.facts.one dd { font-size: 13.5px; color: var(--ink-dim); }
.onreq { font-style: normal; font-size: 12.5px; color: var(--gold); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--green); flex: none; }
.slots { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); }
.slots p { margin: 0; font-size: 13px; color: var(--ink-dim); }
.slot-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; }
.slot-row span { font-size: 12.5px; color: var(--ink-dim); }
.slot-row input, .slots .tz { background: var(--night); border: 1px solid var(--line); border-radius: 6px; padding: 8px 9px; min-width: 0; width: 100%; font-size: 14px; }
.slots .tzrow { display: grid; gap: 4px; }
.slots .tzrow label { font-size: 12.5px; color: var(--ink-dim); }
.book { border: 1px solid var(--teal); border-radius: var(--r); padding: 16px; background: rgba(67, 197, 173, .08); display: grid; gap: 8px; }
.book h3 { margin: 0; font: 800 18px var(--display); }
.book p { margin: 0; color: var(--ink-dim); font-size: 14px; }
.mobilebar { display: none; }
.rail .railclose { display: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-dim); font-size: 14px; pointer-events: none; }

/* ---------- phones ---------- */
@media (max-width: 820px) {
  :root { --rail-w: 0px; }
  body.panel-open #globe, body:not(.panel-open) #globe { transform: none; }

    const b = S.sel, ps = planState(b);
    const prev = ps.i >= 0 ? S.plan[ps.i] : {};
    const item = isEnq(b) ? { id: b.id, enq: true, date: prev.date || '' } : b.ratecard ? { id: b.id, opt: S.opt, date: prev.date || '' } : { id: b.id, pkg: S.pkg, date: prev.date || '' };
    let msg;
    if (ps.i >= 0 && ps.same) { S.plan.splice(ps.i, 1); msg = t('removed'); }
    else if (ps.i >= 0) { S.plan[ps.i] = item; msg = t('updated'); }
    else { S.plan.push(item); msg = t('added'); }
    savePlan(); renderPanel(); toast(msg);
  }
  function openPlan() {
    S.sel = null; S.cluster = null; S.view = 'plan'; if (world) world.ringsData([]); refreshMarkers();
    document.body.classList.add('panel-open'); document.body.classList.remove('rail-open');
    renderPlan();
  }
  function renderPlan() {
    $('#panel').dataset.board = '';
    const P = $('#panel'), cur = planCur();
    S.plan = S.plan.filter((p) => { const b = S.byId[p.id]; return b && !isSpace(b) && (isEnq(b) ? !!p.enq : b.ratecard ? rcOption(b, p.opt) : b.packages[p.pkg]); });
    const anyEnq = S.plan.some((p) => S.byId[p.id].enquiry), anyPriced = S.plan.some((p) => !S.byId[p.id].enquiry);
    savePlan();
    const items = S.plan.map((p, i) => {
      const b = S.byId[p.id];
      const opts = isEnq(b) ? [] : b.ratecard ? rcOptions(b).map((o) => `<option value="${o.key}" ${o.key === p.opt ? 'selected' : ''}>${esc(optLabel(b, o))}</option>`)
        : PKGS.filter((k) => b.packages[k]).map((k) => `<option value="${k}" ${k === p.pkg ? 'selected' : ''}>${esc(t('p.' + k))}</option>`);
      return `<div class="pitem">${b.img ? `<img src="${esc(b.img)}" alt="">` : '<span class="noimg"></span>'}
        <div class="t"><b>${esc(tb(b, 'name'))}</b><span>
          ${isEnq(b) ? `<em class="onreq">${esc(t('quoteOnRequest'))}</em>` : `<select data-i="${i}" id="plan-opt-${i}" aria-label="${esc(t('option'))}: ${esc(tb(b, 'name'))}">${opts.join('')}</select>`}
          <input type="date" data-d="${i}" id="plan-date-${i}" value="${esc(p.date || '')}" aria-label="${esc(t('date'))}: ${esc(tb(b, 'name'))}"></span></div>
        <span class="amt">${isEnq(b) ? esc(t('amtOnRequest')) : money(itemPrice(p), cur)}</span>
        <button class="iconbtn" type="button" data-rm="${i}" aria-label="${esc(t('remove'))}: ${esc(tb(b, 'name'))}">${ICON.trash}</button></div>`;
    }).join('');
    P.innerHTML = `<div class="scroll"><div class="body">
        <div class="head"><h2>${esc(t('yourPlan'))}</h2><button class="iconbtn" type="button" data-act="close" aria-label="${esc(t('close'))}">${ICON.x}</button></div>
        ${S.plan.length ? `<div>${items}</div>
          ${anyPriced ? `<div class="total"><span>${esc(t(anyEnq ? 'estTotalPartial' : 'estTotal'))}</span><strong>${money(planTotal(), cur)}</strong></div>` : ''}
          <p class="note">${esc([t('planNote'), anyEnq ? t('planOnRequestNote') : '', fxNote(cur)].filter(Boolean).join(' '))}</p>` : `<p class="note">${esc(t('planEmpty'))}</p>`}
      </div></div>
      ${S.plan.length ? `<div class="foot"><button class="cta" type="button" data-act="inquire">${ICON.send}${esc(t('sendInquiry'))}</button></div>` : ''}`;
    P.hidden = false;
  }

  // ---------- inquiry ----------
  function renderForm(err) {
    $('#panel').dataset.board = '';
    S.view = 'form';
    const f = S.form;
    const occ = ['birthday', 'anniversary', 'launch', 'other'];
    $('#panel').innerHTML = `<div class="scroll"><div class="body">
        <div class="head"><h2>${esc(t('formTitle'))}</h2><button class="iconbtn" type="button" data-act="close" aria-label="${esc(t('close'))}">${ICON.x}</button></div>
        <p class="note">${esc(t('formIntro'))}</p>
        <form class="form" id="inqForm" novalidate>
          <div class="field"><label for="f-name">${esc(t('name'))}</label><input id="f-name" name="name" autocomplete="name" required value="${esc(f.name || '')}"></div>
          <div class="field"><label for="f-email">${esc(t('email'))}</label><input id="f-email" name="email" type="email" autocomplete="email" required value="${esc(f.email || '')}"></div>
          <div class="field"><label for="f-contact">${esc(t('contact'))}</label><input id="f-contact" name="contact" value="${esc(f.contact || '')}"></div>
          <div class="field"><label for="f-occasion">${esc(t('occasion'))}</label><select id="f-occasion" name="occasion">${occ.map((o) => `<option value="${o}" ${f.occasion === o ? 'selected' : ''}>${esc(t('o.' + o))}</option>`).join('')}</select></div>
          <div class="field"><label for="f-message">${esc(t('message'))}</label><textarea id="f-message" name="message">${esc(f.message || '')}</textarea></div>
          ${err ? `<p class="err" role="alert">${esc(err)}</p>` : ''}
        </form>
        <div class="summary">${esc(planSummary())}</div>
      </div></div>
      <div class="foot"><button class="cta" type="submit" form="inqForm" id="inqSend">${ICON.send}${esc(t('sendInquiry'))}</button>
        <button class="cta ghost" type="button" data-act="toplan">${esc(t('back'))}</button></div>`;
  }
  function planSummary() {
    const cur = planCur();
    const lines = S.plan.map((p) => { const b = S.byId[p.id];
      if (isEnq(b)) return `- ${tb(b, 'name')} (${city(b)}), ${itemLabel(p)}${p.date ? ', ' + p.date : ''}`;
      return `- ${tb(b, 'name')} (${city(b)}), ${itemLabel(p)}${p.date ? ', ' + p.date : ''}: ${b.ratecard ? '' : t('about') + ' '}${money(itemPrice(p), cur)}`; });
    const anyEnq = S.plan.some((p) => S.byId[p.id].enquiry), anyPriced = S.plan.some((p) => !S.byId[p.id].enquiry);
    return `${t('planLbl')}:\n${lines.join('\n')}${anyPriced ? `\n${t(anyEnq ? 'estTotalPartial' : 'estTotal')}: ${money(planTotal(), cur)}` : ''}`;
  }
  function inquiryText() {
    const f = S.form;
    return [t('inqHead'), '', `${t('name')}: ${f.name}`, `${t('email')}: ${f.email}`, f.contact ? `${t('contactLbl')}: ${f.contact}` : null, `${t('occasion')}: ${t('o.' + f.occasion)}`,
      '', planSummary(), f.message ? `\n${t('notes')}: ${f.message}` : null, '', `(${LANGS.find((l) => l[0] === S.lang)[1]}, ${new Date().toISOString().slice(0, 10)})`].filter((x) => x !== null).join('\n');
  }
  // FormSubmit answers 200 with success:false until the address is activated, so check the body too
  async function postInquiry(subject, replyTo, fields) {
    if (!INQUIRY.endpoint) return false;
    try {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 12000);
      const res = await fetch(INQUIRY.endpoint, { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ _subject: subject, _template: 'box', _replyto: replyTo, language: S.lang, ...fields }) });
      clearTimeout(timer);
      const j = await res.json().catch(() => ({}));
      return res.ok && String(j.success) === 'true';
    } catch { return false; }
  }
  async function submitInquiry(e) {
    e.preventDefault();
    const fd = new FormData($('#inqForm'));
    S.form = Object.fromEntries([...fd.entries()].map(([k, v]) => [k, String(v).trim()]));
    if (!S.form.name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.form.email || '')) return renderForm(t('formErr'));
    const btn = $('#inqSend'); btn.disabled = true; btn.textContent = t('sending');
    const subject = t('subject', { name: S.form.name });
    const ok = await postInquiry(subject, S.form.email, { name: S.form.name, email: S.form.email, contact: S.form.contact || '',
      occasion: t('o.' + S.form.occasion), plan: planSummary(), message: S.form.message || '' });
    if (ok) return renderSent();
    renderFallback(subject, inquiryText());
  }
  function spaceText(callOnly) {
    const sp = S.sp, f = sp.f, slots = sp.slots.filter((x) => x.d && x.t);
    return [t(callOnly ? 'inqHeadCall' : 'inqHeadSpace'), '', `${t('name')}: ${f.name}`, `${t('email')}: ${f.email}`, f.contact ? `${t('contactLbl')}: ${f.contact}` : null, '',
      f.what ? `${t('conceptLbl')}: ${f.what}` : null, f.occasion ? `${t('occasion')}: ${t('o.' + f.occasion)}` : null, f.when ? `${t('whenLbl')}: ${f.when}` : null,
      f.budget ? `${t('budgetLbl')}: ${f.budget}` : null,
      slots.length ? `\n${t('callLbl')} (${sp.tz || ''}):\n${slots.map((x, i) => `${i + 1}. ${x.d} ${x.t}`).join('\n')}` : null,
      '', `(${LANGS.find((l) => l[0] === S.lang)[1]}, ${new Date().toISOString().slice(0, 10)})`].filter((x) => x !== null).join('\n');
  }
  async function submitSpace(e) {
    e.preventDefault();
    syncSpace();
    const sp = S.sp, f = sp.f, callMode = sp.tab === 'call', wantsCall = callMode || sp.call;
    const slots = sp.slots.filter((x) => x.d && x.t);
    let err = '';
    if (!f.name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email || '')) err = t('formErr');
    else if (!callMode && !(f.what || '').trim()) err = t('spaceErrWhat');
    else if (wantsCall && !slots.length) err = t('spaceErrSlot');
    if (err) { sp.err = err; renderPanel(); return; }
    sp.err = '';
    const btn = $('#spSend'); if (btn) { btn.disabled = true; btn.textContent = t('sending'); }
    const subject = t(callMode ? 'subjectCall' : 'subjectSpace', { name: f.name });
    const ok = await postInquiry(subject, f.email, { name: f.name, email: f.email, contact: f.contact || '', concept: f.what || '', occasion: f.occasion ? t('o.' + f.occasion) : '',
      needed_by: f.when || '', budget: f.budget || '', call_times: slots.map((x) => `${x.d} ${x.t}`).join(' | '), time_zone: sp.tz || '', plan: spaceText(callMode) });
    if (!ok) return renderFallback(subject, spaceText(callMode));
    sp.done = wantsCall ? 'call' : 'concept';
    renderPanel();
  }
  function renderSent() {
    $('#panel').dataset.board = '';
    S.view = 'sent';
    $('#panel').innerHTML = `<div class="scroll"><div class="body">
      <div class="head"><span></span><button class="iconbtn" type="button" data-act="close" aria-label="${esc(t('close'))}">${ICON.x}</button></div>
      <div class="done"><span class="tick">${ICON.check}</span><h2>${esc(t('sentTitle'))}</h2><p class="note">${esc(t('sentText'))}</p></div></div></div>`;
  }
  function renderFallback(subject, body) {
    $('#panel').dataset.board = '';
    S.view = 'fallback';
    const mailto = `mailto:${INQUIRY.to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    $('#panel').innerHTML = `<div class="scroll"><div class="body">
        <div class="head"><h2>${esc(t('fbTitle'))}</h2><button class="iconbtn" type="button" data-act="close" aria-label="${esc(t('close'))}">${ICON.x}</button></div>
        <p class="note">${esc(t('fbText'))}</p>
        <div class="addr"><span>${esc(INQUIRY.to)}</span><button class="iconbtn" type="button" data-act="copyaddr">${ICON.copy}${esc(t('copyAddr'))}</button></div>
        <div class="summary" id="inqText">${esc(body)}</div>
      </div></div>
      <div class="foot"><a class="cta" href="${esc(mailto)}" target="_blank" rel="noopener" style="text-decoration:none">${ICON.send}${esc(t('emailBtn'))}</a>
        <button class="cta ghost" type="button" data-act="copyinq">${ICON.copy}${esc(t('copyBtn'))}</button></div>`;
  }
  async function copyText(text, el) {
    try { await navigator.clipboard.writeText(text); toast(t('copied')); }
    catch {
      if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      toast(t('selectCopy'));
    }
  }
  let tt;
  function toast(msg) {
    document.querySelectorAll('.toast').forEach((x) => x.remove());
    const n = document.createElement('div'); n.className = 'toast'; n.setAttribute('role', 'status'); n.textContent = msg;
    document.body.appendChild(n); clearTimeout(tt); tt = setTimeout(() => n.remove(), 1800);
  }

  // ---------- events ----------
  function rerender() {
    renderChips(); renderList(); refreshMarkers();
    if ($('#panel').hidden) return;
    if (S.view === 'board' && S.sel) renderPanel();
    else if (S.view === 'plan') renderPlan();
    else if (S.view === 'form') renderForm();
  }
  function bind() {
    $('#chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { S.region = b.dataset.r; rerender(); } });
    $('#kinds').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { S.kind = b.dataset.k; rerender(); } });
    $('#langSel').addEventListener('change', (e) => { S.lang = e.target.value; store.set('ciao-lang', S.lang); applyStatic(); rerender(); });
    $('#curSel').addEventListener('change', (e) => { S.cur = e.target.value; store.set('ciao-cur', S.cur); rerender(); });
    $('#q').addEventListener('input', (e) => { S.q = e.target.value.trim().toLowerCase(); renderList(); refreshMarkers(); });
    $('#list').addEventListener('click', (e) => {
      const r = e.target.closest('.row'); if (!r) return;
      const b = S.byId[r.dataset.id]; openCluster(S.clusters.find((c) => c.boards.includes(b)), b.id);
    });
    const P = $('#panel');
    P.addEventListener('click', (e) => {
      const el = e.target.closest('button'); if (!el) return;
      const act = el.dataset.act;
      if (act === 'close') return closePanel();
      if (act === 'plan') return togglePlan();
      if (act === 'inquire') return renderForm();
      if (act === 'toplan') { S.view = 'plan'; return renderPlan(); }
      if (act === 'copyinq') return copyText($('#inqText').textContent, $('#inqText'));
      if (el.dataset.gal != null && S.sel) { S.gal[S.sel.id] = +el.dataset.gal; return renderPanel(); }
      if (el.dataset.sptab) { syncSpace(); S.sp.tab = el.dataset.sptab; S.sp.err = ''; return renderPanel(); }
      if (el.dataset.spbook) { S.sp.tab = 'call'; S.sp.done = null; S.sp.err = ''; renderPanel(); const sc = $('#panel .scroll'); if (sc) sc.scrollTop = 0; return; }
      if (act === 'copyaddr') return copyText(INQUIRY.to, el.previousElementSibling);
      if (el.dataset.pkg) { S.pkg = el.dataset.pkg; return renderPanel(); }
      if (el.dataset.opt) { S.opt = el.dataset.opt; return renderPanel(); }
      if (el.dataset.rm != null) { S.plan.splice(+el.dataset.rm, 1); savePlan(); return renderPlan(); }
      if (el.dataset.id) selectBoard(S.byId[el.dataset.id]);
    });
    P.addEventListener('change', (e) => {
      const n = e.target;
      if (n.matches('select[data-i]')) { const p = S.plan[+n.dataset.i]; if (S.byId[p.id].ratecard) p.opt = n.value; else p.pkg = n.value; savePlan(); renderPlan(); }
      if (n.matches('input[data-d]')) { S.plan[+n.dataset.d].date = n.value; savePlan(); }
      if (n.id === 'sp-call') { syncSpace(); renderPanel(); }
    });
    P.addEventListener('input', (e) => {
      if (e.target.form && e.target.form.id === 'inqForm') S.form[e.target.name] = e.target.value;
      if (e.target.form && e.target.form.id === 'spaceForm') syncSpace();
    });
    P.addEventListener('submit', (e) => { if (e.target.id === 'inqForm') submitInquiry(e); if (e.target.id === 'spaceForm') submitSpace(e); });
    $('#planBtn').addEventListener('click', openPlan);
    $('#railOpen').addEventListener('click', () => document.body.classList.add('rail-open'));
    $('#railClose').addEventListener('click', () => document.body.classList.remove('rail-open'));
    $('#globe').addEventListener('click', () => document.body.classList.remove('rail-open'));
    addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('#panel').hidden) closePanel(); document.body.classList.remove('rail-open'); } });
  }

  async function boot() {
    applyStatic();
    let data;
    try {
      const res = await fetch('data/boards.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    } catch { $('#loading').textContent = t('loadFail'); return; }
    S.fx = data.meta.fx_per_usd || { USD: 1 };
    S.i18n = data.meta.i18n || {};
    S.boards = data.boards;
    S.boards.forEach((b) => { S.byId[b.id] = b; });
    S.clusters = cluster(S.boards);
    savePlan(); renderChips(); renderList(); bind();
    if (typeof Globe !== 'function') { $('#loading').textContent = t('loadFail'); return; }
    initGlobe();
    $('#loading').remove();
    refreshMarkers();
    const hash = location.hash.slice(1);
    if (hash === 'plan') setTimeout(openPlan, 400);
    else if (hash && S.byId[hash]) { const b = S.byId[hash]; setTimeout(() => openCluster(S.clusters.find((c) => c.boards.includes(b)), b.id), 600); }
  }
  boot();
})();
</script>

</html>
