<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 176" width="140" height="176" role="img" aria-label="Astronaut">
  <defs>
    <linearGradient id="as-suit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d7e4"/></linearGradient>
    <linearGradient id="as-pack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9bccd"/><stop offset="1" stop-color="#6c8399"/></linearGradient>
    <radialGradient id="as-visor" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#b9e0ff"/><stop offset=".45" stop-color="#4a8fd1"/><stop offset="1" stop-color="#0c2038"/></radialGradient>
    <linearGradient id="as-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#73d43a"/><stop offset=".5" stop-color="#43c5ad"/><stop offset="1" stop-color="#5aa7e1"/></linearGradient>
    <clipPath id="as-vclip"><ellipse cx="77" cy="44" rx="23" ry="19"/></clipPath>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- backpack -->
    <rect x="30" y="68" width="46" height="58" rx="11" fill="url(#as-pack)" stroke="#5d748a" stroke-width="2"/>
    <rect x="38" y="80" width="30" height="8" rx="4" fill="#5d748a" opacity=".55"/>
    <!-- legs and boots -->
    <path d="M62 122 L48 150" stroke="#b7c6d4" stroke-width="23" fill="none"/>
    <path d="M62 122 L48 150" stroke="url(#as-suit)" stroke-width="19" fill="none"/>
    <path d="M86 122 L106 140" stroke="#b7c6d4" stroke-width="23" fill="none"/>
    <path d="M86 122 L106 140" stroke="url(#as-suit)" stroke-width="19" fill="none"/>
    <ellipse cx="44" cy="158" rx="14" ry="9" fill="#6c8399" stroke="#4e6479" stroke-width="2" transform="rotate(-22 44 158)"/>
    <ellipse cx="112" cy="146" rx="14" ry="9" fill="#6c8399" stroke="#4e6479" stroke-width="2" transform="rotate(38 112 146)"/>
    <!-- raised arm (waving) -->
    <path d="M54 76 L30 66 L22 44" stroke="#b7c6d4" stroke-width="21" fill="none"/>
    <path d="M54 76 L30 66 L22 44" stroke="url(#as-suit)" stroke-width="17" fill="none"/>
    <circle cx="20" cy="36" r="10" fill="#f2f7fb" stroke="#b7c6d4" stroke-width="2"/>
    <!-- torso -->
    <rect x="48" y="62" width="56" height="64" rx="20" fill="url(#as-suit)" stroke="#b7c6d4" stroke-width="2"/>
    <rect x="62" y="82" width="30" height="21" rx="5" fill="#0d2238"/>
    <circle cx="69" cy="92" r="3" fill="#73d43a"/><circle cx="77" cy="92" r="3" fill="#43c5ad"/><circle cx="85" cy="92" r="3" fill="#5aa7e1"/>
    <rect x="54" y="112" width="44" height="5" rx="2.5" fill="url(#as-brand)"/>
    <!-- lowered arm -->
    <path d="M98 76 L116 92 L118 110" stroke="#b7c6d4" stroke-width="21" fill="none"/>
    <path d="M98 76 L116 92 L118 110" stroke="url(#as-suit)" stroke-width="17" fill="none"/>
    <circle cx="118" cy="118" r="10" fill="#f2f7fb" stroke="#b7c6d4" stroke-width="2"/>
    <!-- shoulder patch -->
    <rect x="55" y="70" width="16" height="6" rx="3" fill="url(#as-brand)"/>
    <!-- collar and helmet -->
    <ellipse cx="76" cy="68" rx="22" ry="7" fill="#b7c6d4"/>
    <line x1="78" y1="12" x2="78" y2="2" stroke="#8aa0b4" stroke-width="3"/><circle cx="78" cy="3" r="3.5" fill="#43c5ad"/>
    <circle cx="76" cy="42" r="33" fill="url(#as-suit)" stroke="#b7c6d4" stroke-width="2"/>
    <ellipse cx="77" cy="44" rx="23" ry="19" fill="url(#as-visor)" stroke="#8aa0b4" stroke-width="2"/>
    <g clip-path="url(#as-vclip)">
      <circle cx="90" cy="64" r="22" fill="#3b82c4" opacity=".9"/>
      <path d="M72 54 q8 -6 16 -2 q6 3 8 10 q-12 4 -24 -2z" fill="#73d43a" opacity=".75"/>
      <ellipse cx="66" cy="34" rx="9" ry="5" fill="#fff" opacity=".7" transform="rotate(-28 66 34)"/>
    </g>
  </g>
</svg>
